[project]
name = "aegis-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RIMON DEBNATH", email = "68506201+Rimonok12@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "supabase>=2.33.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
aegis-backend = "aegis_backend:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
